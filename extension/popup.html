<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RabbitHole</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand">RH / RABBITHOLE</div>

    <h1>Follow your curiosity.</h1>
    <p>Turn your browsing journey into a knowledge graph.</p>

    <label for="session-title">Session name</label>
    <input
      id="session-title"
      type="text"
      placeholder="What are you exploring?"
    >

    <button id="start-btn">Start RabbitHole</button>

    <div id="status">Ready to explore</div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
